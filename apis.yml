name: Archive Technologies
description: >-
  Archive (Archive Technologies, Inc.) is an AI-powered creator and community marketing
  platform for e-commerce brands, founded in 2021 and headquartered in Miami, FL. Archive
  automates social listening across TikTok, Instagram, and YouTube, creator discovery, UGC
  rights and repurposing, campaign tracking, and reporting. Its public developer surface is
  the Archive API — a GraphQL API at POST https://app.archive.com/api/v2 that gives teams
  programmatic access to workspace data (creators, social profiles, UGC items, engagement
  history, content views, collections, campaigns, and competitor brands) authenticated with
  a workspace-scoped bearer token plus a WORKSPACE-ID header. The schema is published as a
  full reference (53 operations — 29 queries and 24 mutations — over 135 types) even though
  runtime introspection is disabled. Archive also operates an OAuth-protected remote MCP
  server at https://app.archive.com/api/v2/mcp whose 53 tools map 1:1 to those GraphQL
  operations, and both surfaces draw on the same per-workspace credit budget alongside a flat
  5 requests/second ceiling, signalled at runtime with IETF ratelimit headers. Archive is
  backed by Battery Ventures among others.
