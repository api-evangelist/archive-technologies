apis:
- name: Archive API
  description: >-
    Archive's public GraphQL API for programmatic access to creator and UGC workspace data —
    creators, social profiles, items (posts/reels/stories/videos), engagement history,
    content views, collections, campaigns, and competitor brands. Single POST endpoint;
    authenticated with a workspace-scoped bearer token (arch_live_...) and a WORKSPACE-ID
    header. Cursor-paginated (first/after, nodes/pageInfo). Two limits apply at once: a flat
    5 requests/second per workspace and a per-plan credit budget, both reported on every
    response via the ratelimit / ratelimit-policy headers. Introspection is disabled in
    production; the published schema reference is the schema of record.
  humanURL: https://api-docs.archive.com
