- name: Enterprise 2026
  price: null
  currency: null
  billing_period: null
  quota:
    burst_credits: 60000
    refill_credits_per_second: 1000
    sustained_credits_per_day: 86400000
  limits:
    requests_per_second: 5
  note: >-
    Has credits for sixteen items pages per second, but the flat 5 requests/second ceiling
    holds it to five — on this tier the request ceiling binds before credits do.
  source: https://api-docs.archive.com/concepts/rate-limiting
- name: Base / fallback
  price: null
  currency: null
  billing_period: null
  quota:
    burst_credits: 5000
    refill_credits_per_second: 50
    sustained_credits_per_day: 4300000
  limits:
    requests_per_second: 5
  note: >-
    Applies to any workspace not on a 2026 plan, most often a legacy plan. Same allowance as
    Startup 2026. Appears as "base" in the ratelimit-policy response header.
  source: https://api-docs.archive.com/concepts/rate-limiting
feature_gating:
  api_access: >-
    API token generation is self-service under Settings -> API, but only on compatible plans.
  mcp_server: >-
    Included on some plans only; the help-center article "Using the Archive MCP Server"
    documents which plans include it.
  competitor_insights: available on plans that include Competitor Insights
  refetch_engagement_bulk: requires a feature flag (arranged with a CSM)
overage: >-
  Not published as a monetary overage. Exceeding the budget throttles rather than bills: the
  request returns HTTP 429 with Retry-After and extensions.code RATE_LIMIT_EXCEEDED. Archive
  states going over the limit "costs you time, not data".
notes:
- >-
  The plan name is discoverable at runtime without asking sales: the ratelimit-policy response
  header names the caller's plan and gives its burst allowance
  (e.g. ratelimit-policy: "growth";q=15000;w=60).
- >-
  A request costs a fixed amount for the search plus a small amount per record, so the
  published cost table is expressed per page of 100. See
  rate-limits/archive-technologies-rate-limits.yml for the per-request costs.
