  limits:
    requests_per_second: 5
  note: Sustains about four full items pages, or four writes, per second.
  source: https://api-docs.archive.com/concepts/rate-limiting
- name: Agency 2026
  price: null
  currency: null
  billing_period: null
  quota:
    burst_credits: 15000
    refill_credits_per_second: 250
    sustained_credits_per_day: 21600000
  limits:
    requests_per_second: 5
  note: >-
    Same allowance as Growth 2026, but every workspace in the agency org carries a full
