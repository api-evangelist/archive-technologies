description: >-
  Archive publishes NO prices. https://archive.com/pricing (HTTP 200) is the "Book a demo"
  form — the nav item labelled Pricing resolves to a page titled "Demo" that collects
  company size, revenue and agency affiliation before a conversation; there is no self-serve
  signup anywhere on archive.com and no published tier price, currency or billing period.
  What Archive DOES publish, in its API rate-limiting reference, is the named plan set and
  the API quota attached to each plan — a credit budget (burst + per-second refill) that is
  the hard, machine-visible quota an integrator is buying. Those tiers are recorded below.
  Prices are null because Archive does not publish them, not because they were not looked for.
plan_count: 5
pricing_published: false
pricing_model: sales-gated (book-a-demo); API usage metered in credits against a per-plan budget
currency: null
billing_period: null
quota_unit: credit
quota_definition: >-
  One credit is one millisecond of backend compute. Cost follows the work a request causes,
  not the size of the response. The MCP server draws on the same budget — a tool call maps to
  a query and costs what that query costs.
quota_scope: per workspace (a token reaching several workspaces gets a full budget in each)
plans:
- name: Startup 2026
  price: null
  currency: null
  billing_period: null
  quota:
    burst_credits: 5000
    refill_credits_per_second: 50
    sustained_credits_per_day: 4300000
  limits:
    requests_per_second: 5
  note: >-
    Refills 50 credits/second, so it sustains just under one full items page (60 credits) per
    second and about one write (~55 credits) per second.
  source: https://api-docs.archive.com/concepts/rate-limiting
- name: Growth 2026
  price: null
