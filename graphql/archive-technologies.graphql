# Archive API — GraphQL schema (SDL)
#
# Provider:   Archive Technologies, Inc. (archive.com)
# Endpoint:   https://app.archive.com/api/v2  (single POST endpoint)
# Source:     https://app.archive.com/api/v2/docs — the provider's own published
#             SpectaQL schema reference, rendered from the live schema.
# Method:     derived. Introspection is DISABLED in production (a __schema query
#             returns 401 / "Missing or invalid authentication token"), so this SDL was
#             reconstructed field-by-field from the provider's published reference rather
#             than from an introspection response. Every type, field, argument, enum value
#             and description below is transcribed verbatim from that page; nothing is
#             inferred or invented. Argument default values are preserved inside the
#             argument descriptions ("Default = ...") exactly as the reference states them,
#             rather than re-encoded as SDL defaults.
# Captured:   2026-08-13
#
# Auth:       Authorization: Bearer arch_live_...  +  WORKSPACE-ID: <workspace uuid>
# Limits:     5 requests/second per workspace AND a per-plan credit budget (see
#             rate-limits/archive-technologies-rate-limits.yml)
# Depth:      max query depth 10

schema {
  query: Query
  mutation: Mutation
}

type Query {
  """
  List and paginate campaigns for the current workspace, ordered newest first. Workflow-type rows
  are excluded to match the in-app CRM listing.
  """
  campaigns(
    """Cursor for fetching the next page of results. Default = null"""
    after: String
    """Number of campaigns to return (page size). Default = 20"""
    first: Int
  ): CampaignConnection!
  """
  Return a single Collection by ID for the current workspace, or null if no such Collection exists
  here.
  """
  collection(
    """ID of the Collection to fetch, as returned by the collections query for this workspace."""
    id: ID!
  ): Collection
  """
  List Collections (saved tag sets) for the current workspace, in the workspace's saved order.
  Returns at most 1000 rows; this field is not paginated.
  """
  collections: [Collection!]!
  """
  Return a single Competitor Insights brand by ID for the current workspace, or null if no brand
  with that ID is tracked here. Also resolves the workspace's own-brand entry by its stable id. Pair
  with competitorBrandItems(brandId:, filter:, …) to paginate the brand's media items. If aggregate
  metrics are unavailable, roster data remains and the response includes a SERVICE_UNAVAILABLE
  error; match on extensions.code and retry later.
  """
  competitorBrand(
    """Anchor date (e.g. 2025-06-01) for the aggregation window. Defaults to today. Default = null"""
    date: DateWithZone
    """Competitor Insights brand ID. Also resolves the workspace's own-brand entry by its stable id."""
    id: ID!
    """Aggregation window for the metric fields (WEEK or MONTH). Defaults to MONTH. Default = MONTH"""
    period: CompetitorBrandStatsPeriod
  ): CompetitorBrand
  """
  Paginate frozen historical Competitor Insights posts for a brand within a required filter.takenAt
  window. Existing rows remain queryable, but no new posts are added.
  """
  competitorBrandItems(
    """
    Opaque cursor for fetching the next page of results. Cursors remain valid if sorting changes
    between pages. A malformed cursor is rejected with an Invalid cursor error; a stale cursor that
    carries no position for the requested sort returns an empty page. Default = null
    """
    after: String
    """
    Competitor Insights brand UUID. If the brand is not tracked by the current workspace, the query
    returns an empty connection.
    """
    brandId: ID!
    """Filter criteria. A takenAt time window is required; unbounded queries are not supported."""
    filter: CompetitorBrandItemFilterInput!
    """Number of posts to return (page size). Default = 20"""
    first: Int
    """
    Sort configuration. Currently accepts a list of at most one entry; multiple entries are
    rejected. The list shape exists for forward compatibility — a future release may honor compound
    sort additively without a breaking schema change. Defaults to [{ sortKey: TAKEN_AT, sortOrder:
    DESC }] when omitted. NOTE: EARNED_MEDIA_VALUE rankings are computed per calendar month. For a
    takenAt window spanning multiple months, results are ordered within each month rather than as a
    single cross-month ranking. Tie-breaker is the post identifier in the same direction as the
    primary sort. Default = [{sortKey: TAKEN_AT, sortOrder: DESC}]
    """
    sorting: [CompetitorBrandItemSortingInput!]
  ): CompetitorBrandItemConnection!
  """
  List Competitor Insights brands tracked by the current workspace, ordered newest first, with
  aggregate metrics over a period/date window (default month). The workspace's own-brand entry is
  returned as one additional pinned node on the first page (flagged isOwnBrand), in addition to up
  to first competitor brands, so self-vs-competitor Share of Voice is computable in-query;
  totalCount counts tracked competitor brands only. Pair with competitorBrandItems(brandId:,
  filter:, …) to paginate a brand's media items. If aggregate metrics are unavailable, roster data
  remains and the response includes a SERVICE_UNAVAILABLE error; match on extensions.code and retry
  later.
  """
  competitorBrands(
    """Cursor for fetching the next page of results. Default = null"""
    after: String
    """Anchor date (e.g. 2025-06-01) for the aggregation window. Defaults to today. Default = null"""
    date: DateWithZone
    """
    Number of competitor brands to return (page size). The own-brand entry is additional. Default =
    20
    """
    first: Int
    """Aggregation window for the metric fields (WEEK or MONTH). Defaults to MONTH. Default = MONTH"""
    period: CompetitorBrandStatsPeriod
  ): CompetitorBrandConnection!
  """
  Return a single saved content (media deck) view by ID for the current workspace, or null if no
  such view exists here. Pair with items(presetId:) to fetch the items belonging to a view.
  """
  contentView(
    """FilterPreset UUID of the content view to fetch."""
    id: ID!
  ): ContentView
  """
  List saved content (media deck) views for the current workspace, ordered by most-recently-updated
  first. Pair with items(presetId:) to fetch the items belonging to a view. Returns at most 1000
  rows; this field is not paginated.
  """
  contentViews(
    """
    Optional filter criteria. When omitted or empty, returns the current workspace's media_deck
    views. Default = {}
    """
    filter: ContentViewFilterInput
  ): [ContentView!]!
  """Return details for the creator."""
  creator(
    """Unique identifier for the creator in Archive's system."""
    id: ID!
  ): Creator!
  """
  Return a single saved Creator View by ID for the current workspace, or null if no such view exists
  here. Pair with creators(presetId:) to fetch the creators belonging to a view.
  """
  creatorView(
    """FilterPreset UUID of the creator view to fetch."""
    id: ID!
  ): CreatorView
  """
  List saved Creator Views for the current workspace, ordered by most-recently-updated first. Pair
  with creators(presetId:) to fetch the creators belonging to a view. Returns at most 1000 rows;
  this field is not paginated.
  """
  creatorViews(
    """
    Optional filter criteria. When omitted or empty, returns the current workspace's creator views.
    Default = {}
    """
    filter: CreatorViewFilterInput
  ): [CreatorView!]!
  """List and paginate creators for the current workspace, ordered newest first."""
  creators(
    """Cursor for fetching the next page of results. Default = null"""
    after: String
    """Creator custom attributes conditions. Default = []"""
    customAttributeConditions: [CustomAttributeConditionInput!]
    """Filter criteria to narrow down results (e.g. by canonical location). Default = {}"""
    filter: CreatorFilterInput
    """Number of creators to return (page size). Default = 20"""
    first: Int
    """
    Saved Creator View ID. When provided, inline filter and customAttributeConditions are ignored;
    the view's stored conditions and sortBy drive the result set. The view's stored filters blob is
    NOT applied — a view whose only narrowing lives in filters returns the whole workspace (see
    README §13.2). Accepts IDs returned by creatorViews / creatorView (workspace Creator Views, GA),
    or by campaignCreatorViews(campaignId:) / campaignCreatorView(id:) (campaign-scoped, ALPHA — opt
    in with the campaign_creator_views header). Non-Creator-View IDs raise a GraphQL error with
    extensions.code = "WRONG_VIEW_TYPE"; cross-shop or unknown IDs raise with extensions.code =
    "NOT_FOUND". Default = null
    """
    presetId: ID
  ): CreatorConnection!
  """
  Retrieve custom attribute schemas to interpret customAttributes values. Returns at most 1000 rows;
  this field is not paginated.
  """
  customAttributeSchemas(
    """Entity type to get schemas for (ITEM or CREATOR)."""
    entity: CustomAttributeSchemaEntity!
  ): [CustomAttributeSchema!]!
  """Paginated history of engagement metric snapshots for a specific item, ordered newest first."""
  engagementHistory(
    """Cursor for fetching the next page of results. Default = null"""
    after: String
    """Filter criteria for engagement history entries. Default = null"""
    filter: EngagementHistoryFilterInput
    """Number of entries to return (page size). Default = 20"""
    first: Int
    """The ID of the item to fetch engagement history for."""
    itemId: ID!
  ): EngagementHistoryConnection!
  """
  List saved filter presets for items queries in the current workspace. Returns at most 1000 rows;
  this field is not paginated.
  """
  filterPresets: [FilterPreset!]!
  """
  Look up item IDs by social media URLs within the current workspace. Accepts any public HTTP(S)
  URL. INVALID_URL is returned only for malformed / non-HTTP URLs or private/reserved hosts; a valid
  public URL we cannot resolve (unrecognized shape, short link, or no matching item) returns
  NOT_FOUND. Recognized shapes (non-exhaustive hint): Instagram (/p/, /reel/, /reels/), TikTok
  (@user/video/{id}, @user/photo/{id}), and YouTube (/shorts/, /watch?v=, youtu.be/).
  """
  itemIdsByUrl(
    """
    Public HTTP(S) URLs to look up (1-100). Any public URL is accepted; INVALID_URL only for
    malformed / non-HTTP URLs or private/reserved hosts, otherwise FOUND or NOT_FOUND.
    """
    urls: [String!]!
  ): [UrlLookupResult!]!
  """Search and paginate archived items (social content) for the current workspace."""
  items(
    """Cursor for fetching the next page of results."""
    after: String
    """Custom attribute filter conditions. Default = []"""
    customAttributeConditions: [CustomAttributeConditionInput!]
    """
    Filter criteria to narrow down results. Default = {accountNames: [], campaignsIds: [],
    collectionsIds: [], ids: [], shopifyProductsIds: [], socialProfileAccountTypes: [],
    socialProfileIds: [], sourcesIds: [], tagsNames: [], viralityScore: []}
    """
    filter: ItemFilterInput
    """Number of items to return (page size). Default = 20"""
    first: Int
    """
    Filter preset ID. When provided, sorting, filter, and customAttributeConditions are ignored.
    Must reference a preset with accessor media_deck or collections — pass IDs returned by
    contentViews / collections queries. Unknown, cross-workspace, or wrong-accessor preset IDs raise
    a GraphQL error with extensions.code = "WRONG_VIEW_TYPE_FOR_ITEMS".
    """
    presetId: ID
    """
    Sorting instructions to apply to the result set. Default = [{sortKey: TAKEN_AT, sortOrder:
    DESC}]
    """
    sorting: [ItemSortingInput!]
  ): ItemConnection!
  """
  Retrieve media contents (images / videos) for shop items (itemIds) or for CompetitorBrandItem rows
  (competitorBrandItemIds). Pass exactly one. See the resolver description for routing details.
  """
  mediaContents(
    """
    CompetitorBrandItem UUIDs to fetch contents for. Obtain them from the
    competitorBrandItems(brandId:, filter:) query. Mutually exclusive with itemIds.
    """
    competitorBrandItemIds: [ID!]
    """Item (shop-item) UUIDs to fetch contents for. Mutually exclusive with competitorBrandItemIds."""
    itemIds: [ID!]
  ): [MediaContent!]!
  """Return details for an operation by ID, including status and progress."""
  operation(
    """Unique identifier for the operation."""
    id: ID!
  ): Operation
  """List operations for the current workspace, ordered newest first."""
  operations(
    """Cursor for fetching the next page of results. Default = null"""
    after: String
    """Number of operations to return (page size). Default = 20"""
    first: Int
  ): OperationConnection!
  """Return details for a social profile by ID or account identifier."""
  socialProfile(
    """Username or handle on the social platform (e.g., "nike" for instagram.com/nike)."""
    accountName: String
    """
    When true, fetches profile from social platform if not archived locally. May increase response
    time. Default = false
    """
    fallback: Boolean
    """Unique identifier of the social profile within your workspace."""
    id: ID
    """Social platform: instagram, tiktok, or youtube. Required when using account_name."""
    provider: Provider
  ): SocialProfile
  """
  Return a single saved Social Profile view by ID for the current workspace, or null if no such view
  exists here.
  """
  socialProfileView(
    """FilterPreset UUID of the social profile view to fetch."""
    id: ID!
  ): SocialProfileView
  """
  List saved Social Profile views for the current workspace, ordered by most-recently-updated first.
  Returns at most 1000 rows; this field is not paginated.
  """
  socialProfileViews(
    """
    Optional filter criteria. When omitted or empty, returns the current workspace's social-profile
    views. Default = {}
    """
    filter: SocialProfileViewFilterInput
  ): [SocialProfileView!]!
  """
  List and paginate social profiles for the current workspace. Pass presetId (a Social Profile View
  id from socialProfileViews / socialProfileView) to drive results off the view's stored conditions
  and sort; otherwise narrow with filter.
  """
  socialProfiles(
    """
    Opaque cursor for fetching the next page. Pass the pageInfo.endCursor from a previous response.
    Per-node edge cursors are NOT valid here. Default = null
    """
    after: String
    """Filter criteria to narrow down results (e.g. by platform). Default = {}"""
    filter: SocialProfileFilterInput
    """Number of social profiles to return (page size). Default = 20"""
    first: Int
    """
    Saved Social Profile View ID. When provided, inline filter is ignored; the view's stored
    customAttributeConditions and sort drive the result set. The view's stored filters blob is NOT
    applied — a view whose only narrowing lives in filters returns the whole workspace (see README
    §13.2). Accepts IDs returned by socialProfileViews / socialProfileView. Non-Social-Profile-View
    IDs raise with extensions.code = "WRONG_VIEW_TYPE"; cross-shop or unknown IDs raise with
    extensions.code = "NOT_FOUND". Default = null
    """
    presetId: ID
  ): SocialProfileConnection!
  """Fetch transcriptions for one or more media contents belonging to the current workspace."""
  transcriptions(
    """Filter by item IDs (maximum 1000)."""
    itemIds: [ID!]
    """Filter by media content IDs (maximum 20)."""
    mediaContentIds: [ID!]
  ): [Transcription!]!
  """
  Return a single user-created view group by ID for the current workspace, or null if no such group
  exists here.
  """
  viewGroup(
    """UUID of the ViewGroup to fetch."""
    id: ID!
  ): ViewGroup
  """
  List user-created view groups for the current workspace, ordered oldest-first. Returns at most
  1000 rows; this field is not paginated.
  """
  viewGroups: [ViewGroup!]!
  """Return details for the current workspace, inferred from the WORKSPACE-ID header."""
  workspace: Workspace!
  """List all workspaces that the current API user has access to."""
  workspaces(
    """Cursor for fetching the next page of results. Default = null"""
    after: String
    """Number of workspaces to return (page size). Default = 20"""
    first: Int
  ): WorkspaceConnection!
}

type Mutation {
  """Add an item to one or more collections."""
  addItemToCollections(
    """Automatically create collections by name if they do not exist. Default = false"""
    autoCreate: Boolean
    """
    IDs of existing collections, as returned by the collections query for this workspace. Several id
    forms are accepted depending on how the workspace stores Collections. An id from another
    workspace, or one this workspace cannot write through this API, rejects the WHOLE call with a
    userErrors entry naming the offending id under collectionIds. Default = []
    """
    collectionIds: [ID!]
    """Names of collections to add the item to. Default = []"""
    collectionNames: [String!]
    """ID of the item to add to collections."""
    itemId: ID!
  ): AddToCollectionsPayload
  """Create a Collection (saved tag set) in the current workspace."""
  createCollection(
    """Mutation input."""
    input: CreateCollectionInput!
  ): CreateCollectionPayload
  """Create a saved content (media deck) view for the current workspace."""
  createContentView(
    """Mutation input."""
    input: CreateContentViewInput!
  ): CreateContentViewPayload
  """Create a saved Creator View for the current workspace."""
  createCreatorView(
    """Mutation input."""
    input: CreateCreatorViewInput!
  ): CreateCreatorViewPayload
  """Create a saved Social Profile view for the current workspace."""
  createSocialProfileView(
    """Mutation input."""
    input: CreateSocialProfileViewInput!
  ): CreateSocialProfileViewPayload
  """Create a user-created view group for the current workspace."""
  createViewGroup(
    """Mutation input."""
    input: CreateViewGroupInput!
  ): CreateViewGroupPayload
  """Delete a Collection (strips the tag from items; does not delete items)."""
  deleteCollection(
    """
    UUID of the Collection to delete (as returned by collections). Collection management is
    available only in workspaces whose Collections use the standard storage; where they use an older
    format the ids collections returns are not accepted here and the call returns a userError
    without changing anything.
    """
    id: ID!
  ): DeleteCollectionPayload
  """Hard-delete a saved content (media deck) view."""
  deleteContentView(
    """FilterPreset UUID of the content view to delete."""
    id: ID!
  ): DeleteContentViewPayload
  """Hard-delete a saved Creator View."""
  deleteCreatorView(
    """FilterPreset UUID of the creator view to delete."""
    id: ID!
  ): DeleteCreatorViewPayload
  """Hard-delete a saved Social Profile view."""
  deleteSocialProfileView(
    """FilterPreset UUID of the social profile view to delete."""
    id: ID!
  ): DeleteSocialProfileViewPayload
  """
  Hard-delete a user-created view group. Returns the FilterPreset UUIDs whose group membership was
  removed so clients can invalidate cached views.
  """
  deleteViewGroup(
    """UUID of the view group to delete."""
    id: ID!
  ): DeleteViewGroupPayload
  """Move a Collection into a view group, or out (when groupId is null)."""
  moveCollectionToGroup(
    """
    UUID of the Collection to move (as returned by collections). Collection management is available
    only in workspaces whose Collections use the standard storage; where they use an older format
    the ids collections returns are not accepted here and the call returns a userError without
    changing anything.
    """
    collectionId: ID!
    """
    Target ViewGroup UUID. Pass null to remove the Collection from any group it currently belongs
    to.
    """
    groupId: ID
  ): MoveCollectionToGroupPayload
  """Move a saved content (media deck) view into a view group, or out (when groupId is null)."""
  moveContentViewToGroup(
    """Target ViewGroup UUID. Pass null to remove the view from any group it currently belongs to."""
    groupId: ID
    """FilterPreset UUID of the Content View to move."""
    viewId: ID!
  ): MoveContentViewToGroupPayload
  """Move a saved Creator View into a view group, or out (when groupId is null)."""
  moveCreatorViewToGroup(
    """Target ViewGroup UUID. Pass null to remove the view from any group it currently belongs to."""
    groupId: ID
    """FilterPreset UUID of the Creator View to move."""
    viewId: ID!
  ): MoveCreatorViewToGroupPayload
  """Move a saved Social Profile view into a view group, or out (when groupId is null)."""
  moveSocialProfileViewToGroup(
    """Target ViewGroup UUID. Pass null to remove the view from any group it currently belongs to."""
    groupId: ID
    """FilterPreset UUID of the Social Profile View to move."""
    viewId: ID!
  ): MoveSocialProfileViewToGroupPayload
  """Queue a bulk engagement data refresh for the specified items."""
  refetchEngagementBulk(
    """
    IDs of items to refresh engagement data for. Items belonging to other workspaces are silently
    ignored. Instagram stories are automatically excluded.
    """
    itemIds: [ID!]!
  ): RefetchBulkPayload
  """Remove an item from one or more collections."""
  removeItemFromCollections(
    """
    IDs of collections to remove the item from, as returned by the collections query for this
    workspace. Several id forms are accepted depending on how the workspace stores Collections. An
    id from another workspace, or one this workspace cannot write through this API, rejects the
    WHOLE call with a userErrors entry naming the offending id under collectionIds. Default = []
    """
    collectionIds: [ID!]
    """Names of collections to remove the item from. Default = []"""
    collectionNames: [String!]
    """ID of the item to remove from collections."""
    itemId: ID!
  ): RemoveFromCollectionsPayload
  """
  Reorder the submitted Content View, Social Profile View, and Creator View ids within the named
  group. Members omitted from viewIds keep their relative order and sort after the listed views.
  """
  reorderViewsInGroup(
    """UUID of the ViewGroup whose member views should be reordered."""
    groupId: ID!
    """
    FilterPreset UUIDs in the desired display order. Must list only views that are currently members
    of this group. The first id becomes position 1.
    """
    viewIds: [ID!]!
  ): ReorderViewsInGroupPayload
  """Rename a Collection in the current workspace."""
  updateCollection(
    """
    UUID of the Collection to update (as returned by createCollection / collections). Collection
    management is available only in workspaces whose Collections use the standard storage; where
    they use an older format the ids collections returns are not accepted here and the call returns
    a userError without changing anything.
    """
    id: ID!
    """Mutation input."""
    input: UpdateCollectionInput!
  ): UpdateCollectionPayload
  """Partial-update a saved content (media deck) view."""
  updateContentView(
    """FilterPreset UUID of the content view to update."""
    id: ID!
    """Partial-update input. Only provided fields are updated."""
    input: UpdateContentViewInput!
  ): UpdateContentViewPayload
  """Partial-update a saved Creator View."""
  updateCreatorView(
    """FilterPreset UUID of the creator view to update."""
    id: ID!
    """Partial-update input. Only provided fields are updated."""
    input: UpdateCreatorViewInput!
  ): UpdateCreatorViewPayload
  """Partial-update a saved Social Profile view."""
  updateSocialProfileView(
    """FilterPreset UUID of the social profile view to update."""
    id: ID!
    """Partial-update input. Only provided fields are updated."""
    input: UpdateSocialProfileViewInput!
  ): UpdateSocialProfileViewPayload
  """Rename a user-created view group."""
  updateViewGroup(
    """UUID of the view group to rename."""
    id: ID!
    """Update input. name is the only mutable field today."""
    input: UpdateViewGroupInput!
  ): UpdateViewGroupPayload
  """Enqueue a single UGC URL for import into the current workspace."""
  uploadItemFromUrl(
    """Mutation input."""
    input: UploadItemFromUrlInput!
  ): UploadItemFromUrlPayload
}

"""
Represents non-fractional signed whole numeric values. Since the value may exceed the size of a
32-bit integer, it's encoded as a string.
"""
scalar BigInt

"""
Represents an ISO 8601-encoded date and time string. For example, 3:50 pm on September 7, 2019 in
the time zone of UTC (Coordinated Universal Time) is represented as "2019-09-07T15:50:00Z"
"""
scalar DateTime

"""
An ISO 8601-encoded date and time. Input must be UTC (e.g., YYYY-MM-DDTHH:MM:SSZ). Output is always
formatted in UTC (ending with Z).
"""
scalar DateTimeWithZone

"""
An ISO 8601-encoded date (YYYY-MM-DD). Input is parsed into the start of the day in the application
timezone.
"""
scalar DateWithZone

"""Represents untyped JSON"""
scalar JSON

"""Field to use when ordering posts under a Competitor Insights brand."""
enum CompetitorBrandItemSortKey {
  """
  Sort by earned media value (EMV). Rankings are computed per calendar month — for a takenAt window
  spanning multiple months, results are ordered within each month rather than as a single cross-
  month ranking.
  """
  EARNED_MEDIA_VALUE
  """Sort by when the content was originally posted on the social platform."""
  TAKEN_AT
}

"""Availability of the workspace's own-brand metrics for the requested window."""
enum CompetitorBrandOwnMetricsStatus {
  """
  Own-brand metrics were computed. Null metric fields mean no data in this window (distinct from
  zero).
  """
  AVAILABLE
  """
  Own-brand metrics could not be computed. The accompanying error explains whether to retry; metric
  fields are null.
  """
  UNAVAILABLE
}

"""Aggregation window for Competitor Insights metrics."""
enum CompetitorBrandStatsPeriod {
  """Aggregate over the month containing the anchor date."""
  MONTH
  """Aggregate over the week containing the anchor date."""
  WEEK
}

"""Entity type that custom attributes can be attached to."""
enum CustomAttributeSchemaEntity {
  """Creator profile"""
  CREATOR
  """Item (archived social content)"""
  ITEM
}

"""
Data type of a workspace-defined custom attribute. Determines the value shape and the valid filter
operators for conditions on that attribute.
"""
enum CustomAttributeType {
  """True/false value."""
  BOOLEAN
  """List of true/false values."""
  BOOLEAN_LIST
  """Calendar date value (ISO 8601, no time component)."""
  DATE
  """Date-and-time value (ISO 8601)."""
  DATETIME
  """List of date-and-time values (ISO 8601)."""
  DATETIME_LIST
  """List of calendar date values (ISO 8601, no time component)."""
  DATE_LIST
  """Email address value."""
  EMAIL
  """Multiple choices from a predefined option list; the stored value is an array of option IDs."""
  MULTIPLE_SELECT
  """
  Multiple choices from a predefined option list; the stored value is an array of option IDs.
  Successor revision of MULTIPLE_SELECT with identical filtering behavior.
  """
  MULTIPLE_SELECT_V2
  """Numeric value."""
  NUMBER
  """List of numeric values."""
  NUMBER_LIST
  """Phone number value."""
  PHONE
  """
  Structured shipping address. Not filterable — conditions with this type are rejected with a
  validation error; read the value from the record's customAttributes instead.
  """
  SHIPPING_ADDRESS
  """Single choice from a predefined option list; the stored value is an option ID."""
  SINGLE_SELECT_V2
  """
  Single choice from a predefined option list; the stored value is an option ID. Successor revision
  of SINGLE_SELECT_V2 with identical filtering behavior.
  """
  SINGLE_SELECT_V3
  """Free-form text value."""
  TEXT
  """List of free-form text values."""
  TEXT_LIST
  """URL value."""
  URL
}

"""Status of a contract request (usage rights, whitelisting, etc.)."""
enum FilterContractStatus {
  """Contract has been approved by the creator."""
  APPROVED
  """Contract approval has expired."""
  EXPIRED
  """Contract request is queued for processing."""
  IN_QUEUE
  """Contract request was rejected by the creator."""
  REJECTED
  """Contract has been requested but not yet responded to."""
  REQUESTED
}

"""Engagement metric that an engagement range filter applies to."""
enum FilterEngagementField {
  """Total number of comments."""
  COMMENT_COUNT
  """Estimated earned media value (EMV) in cents."""
  EARNED_MEDIA_VALUE
  """Engagement rate: total engagements divided by the creator's follower count."""
  ENGAGEMENTS_RATE
  """Impressions rate: views, plays, or estimated impressions divided by the creator's follower count."""
  IMPRESSIONS_RATE
  """Total number of likes."""
  LIKE_COUNT
