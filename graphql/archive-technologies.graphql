"""
Comparison operator for a custom-attribute condition. The valid subset depends on the attribute
type: text and single-select, number, date, boolean, or multi-value (multi-select and list types).
"""
enum FilterOperator {
  """Inclusive range match for number and date types; value is { from, to }."""
  BETWEEN
  """
  For text-like types: substring match. For multi-select and list types: matches records containing
  ANY of the provided values (OR semantics).
  """
  CONTAINS
  """
  For multi-select custom attributes: matches records whose value array contains ALL of the provided
  values (AND semantics).
  """
  CONTAINS_ALL
  """
  For text-like types: excludes substring matches. For multi-select and list types: excludes records
  containing any of the provided values.
  """
  DOES_NOT_CONTAIN
  """Suffix match, for text-like types."""
  ENDS_WITH
  """Equality, for number and date types."""
  EQUAL
  """
  Exact match. For text and single-select types (for selects, value is the option ID) and BOOLEAN
  (value is true/false).
  """
  IS
  """Matches records with no value set. Value is ignored — pass null."""
  IS_EMPTY
  """Exact non-match, for text and single-select types."""
  IS_NOT
  """Matches records with any value set. Value is ignored — pass null."""
  IS_NOT_EMPTY
  """
  Matches date values in a period relative to today; value is { relation: "past"|"this"|"next",
  period: "day"|"week"|"month"|"year" } (offset optional).
  """
  IS_RELATIVE_TO_TODAY
  """Strictly less than, for number and date types."""
  LESS_THAN
  """Less than or equal, for number and date types."""
  LESS_THAN_OR_EQUAL
  """Strictly greater than, for number and date types."""
  MORE_THAN
  """Greater than or equal, for number and date types."""
  MORE_THAN_OR_EQUAL
  """Inequality, for number and date types."""
  NOT_EQUAL
  """Prefix match, for text-like types."""
  STARTS_WITH
}

