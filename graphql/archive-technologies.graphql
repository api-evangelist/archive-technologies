day 9 of the following month.
"""
type CompetitorBrandItem {
  """
  Stable Archive permalink for this post. Unlike originalUrl, this URL keeps resolving after the
  source post is deleted on the originating platform. Mirrors Item.archivePublicUrl for parity.
  """
  archivePublicUrl: String
  """Caption text of the post, when available. Mirrors Item.caption for parity."""
  caption: String
  """
  Most recent engagement metrics (likes, comments, views, shares, EMV) and virality score for this
  post.
  """
  currentEngagement: Engagement
  """Platform-side identifier (Instagram media id, TikTok video id, etc.)."""
  externalId: ID!
  """List of hashtags used in the post. Mirrors Item.hashtags for parity."""
  hashtags: [String!]
  """Unique identifier of the underlying media item in Archive's system."""
  id: ID!
  """List of @-mentions used in the post. Mirrors Item.mentions for parity."""
  mentions: [String!]
  """
  Direct URL to the post on the source platform. Null for content types without a public URL (e.g.
  Instagram Stories).
  """
  originalUrl: String
  """Platform the post was published on."""
  provider: Provider!
  """Social media profile that posted this content."""
  socialProfile: SocialProfile!
  """When the post was published on the source platform."""
  takenAt: DateTime!
  """
  Text transcriptions and subtitles generated for video content in this post. Mirrors
  Item.transcriptions for parity.
  """
  transcriptions: [Transcription!]!
  """Type of post (post / reel / story / short). Mirrors Item.type for parity."""
  type: ItemType!
}

