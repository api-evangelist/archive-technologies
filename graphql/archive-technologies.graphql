"""
A connected social account for the workspace. Each entry represents one row in Archive's
integrations table — distinct from Workspace.mentions, which lists tracked @-mention terms. Multiple
integrations may share the same handle (e.g. two TikTok accounts under one tag) and each gets a
distinct id.
"""
type Integration {
  """Timestamp when the integration was first established (ISO 8601 UTC)."""
  connectedAt: DateTimeWithZone!
  """
  Public-facing account handle for this integration (for example "support_testing"). Sourced from
  the associated mention tag.
  """
  handle: String!
  """
  Stable unique identifier for this integration (UUID). Distinguishes multiple integrations that
  share the same handle.
  """
  id: ID!
  """Platform on which this account is connected (for example INSTAGRAM, TIKTOK, YOUTUBE, or INTERNAL)."""
  provider: Provider!
  """
  Lifecycle state of the integration. CONNECTED = active and verified; DISCONNECTED = the account
  was removed or the integration failed; PENDING = setup in progress.
  """
  status: IntegrationStatus!
}

