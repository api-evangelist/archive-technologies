description: >-
  Archive operates an official hosted remote MCP server at https://app.archive.com/api/v2/mcp,
  discoverable via RFC 9728 protected-resource metadata
  (well-known/archive-technologies-oauth-protected-resource.json) and authorized by the OAuth
  authorization server at https://app.archive.com (RFC 8414 metadata in
  well-known/archive-technologies-oauth-authorization-server.json). The server is
  OAuth-protected: authorization_code + refresh_token grants, PKCE S256, dynamic client
  registration (/oauth/register) and a single "mcp" scope; no client id/secret is issued to
  connector authors. Archive publishes the complete tool catalog at
  https://api-docs.archive.com/mcp — 53 tools, 29 read and 24 write — and states the page is
  kept in sync with the live server. The tool list below is transcribed verbatim from that
  page. A live tools/list call is NOT anonymous: it returns HTTP 401 with a
  WWW-Authenticate Bearer challenge pointing at the protected-resource metadata, so per-tool
  inputSchema requires an authenticated introspection and is not asserted here. Each tool
  maps to a GraphQL query or mutation on the same API and spends the same per-workspace
  credit budget (see mcp/archive-technologies-tool-crosswalk.yml and
  rate-limits/archive-technologies-rate-limits.yml).
server:
  name: archive
  transport: http
  url: https://app.archive.com/api/v2/mcp
  auth: oauth2
  protected_resource: well-known/archive-technologies-oauth-protected-resource.json
  authorization_server: https://app.archive.com
  oauth:
    authorization_endpoint: https://app.archive.com/oauth/authorize
    token_endpoint: https://app.archive.com/oauth/token
    registration_endpoint: https://app.archive.com/oauth/register
    grant_types:
    - authorization_code
    - refresh_token
    code_challenge_methods:
    - S256
    scopes:
    - mcp
    dynamic_client_registration: true
    note: >-
      Connector authors never supply an OAuth client id or secret — Archive publishes its
      OAuth metadata and supports dynamic client registration, so the client registers itself.
deployment:
  mode: remote
  endpoint: https://app.archive.com/api/v2/mcp
  auth: oauth
  verified: probed
  probe: gated
  probe_detail: >-
    POST tools/list (2026-08-13) returned HTTP 401
    {"jsonrpc":"2.0","id":1,"error":{"code":-32001,"message":"Authentication required"}}
    with www-authenticate: Bearer resource_metadata="https://app.archive.com/.well-known/oauth-protected-resource".
  checked: '2026-08-13'
access:
  scoping: >-
    Every tool is workspace-scoped — it acts on the workspace the client is connected to, or
    the one the user names.
  consent: >-
    Browser sign-in ends on Archive's consent screen, where the user chooses read-only vs.
    full access and which workspaces to grant. Both default to the permissive option.
  approval: >-
    Every write tool runs behind a per-call approval in the AI client (Always allow / Ask /
    Never). Deletes only remove the saved view, collection or group — never the underlying
    content, creators or media.
  identity_modes:
  - mode: browser-sign-in
    acts_as: the individual user; each person authorizes their own connection
    token: none
    clients: [Claude, Claude Code, ChatGPT]
  - mode: config-file + API token
    acts_as: the whole workspace, not a person
    token: workspace API token stored in an MCP config file
    clients: any client that reads an MCP config file (including Claude Desktop, Claude Code)
  directory_listing: >-
    Archive is not yet listed in the Claude or ChatGPT connector directories; both require a
    custom connector created once per workspace (name + server URL only).
  errors: >-
    Errors are returned as text, not exceptions — a rate-limited call comes back as
    "Rate limit exceeded. Retry after N seconds." and a domain rejection on a write comes
    back in userErrors (the write did not happen).
  cost: >-
    MCP calls spend the same per-workspace credit budget as the GraphQL API. There is no
    separate MCP allowance.
