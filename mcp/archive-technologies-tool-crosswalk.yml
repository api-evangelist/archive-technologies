notes:
- Both surfaces draw on the same per-workspace credit budget; an MCP tool call costs what its backing
  query costs.
- Every write tool is gated behind a per-call approval in the AI client, and deletes remove only the saved
  view/collection/group.
- Errors on the MCP surface are returned as text rather than exceptions; mutation domain rejections surface
  in userErrors.
