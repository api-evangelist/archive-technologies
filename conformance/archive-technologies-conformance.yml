    SDL at graphql/archive-technologies.graphql (53 operations, 135 types). Introspection is
    disabled in production, so the schema is discoverable only through the published
    reference, not at runtime.
- id: graphql-cursor-connections
  conforms: true
  evidence: >-
    Relay-style Connection/Edge types with nodes, edges, pageInfo (hasNextPage,
    hasPreviousPage, startCursor, endCursor) and totalCount across items, creators,
    socialProfiles, campaigns, competitorBrands and engagementHistory.
- id: graphql-introspection
  conforms: false
  evidence: >-
    __schema / __type are disabled in production; POST {__schema{queryType{name}}} returns
    HTTP 401. Clients cannot discover the schema at runtime.
- id: oauth2
  conforms: true
